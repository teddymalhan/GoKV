name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Codecov authenticates with GitHub OIDC instead of a repository secret.
  id-token: write

jobs:
  test:
    # db/os_unix.go and db/os_other.go are selected by build tag, so a
    # Linux-only matrix never compiles — let alone exercises — the !unix path.
    # Windows covers os_other.go; macOS covers a second unix flavour of the
    # directory-fsync path in os_unix.go.
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        go:
          - "1.25"
          - "stable"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        # Only on Linux: Windows runners check out with core.autocrlf=true, so
        # `git diff` reports phantom changes there.
        if: matrix.os == 'ubuntu-latest'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Run tests (race)
        # -race needs cgo and a C toolchain, which is preinstalled on the
        # Linux and macOS runners.
        if: matrix.os != 'windows-latest'
        run: go test -v -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Run tests
        # The Windows runner's C toolchain is not guaranteed, and the point of
        # this leg is build-tag coverage of db/os_other.go, not race detection.
        if: matrix.os == 'windows-latest'
        run: go test -v -shuffle=on ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.25'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out
          use_oidc: true
          # A coverage report that silently fails to upload is a coverage gate
          # that does not exist. See codecov.yml for the thresholds enforced.
          fail_ci_if_error: true
